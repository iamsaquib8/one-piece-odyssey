# Netlify deployment. The app is a static Vite build with no server, no API and no
# outbound network calls: fonts are self-hosted and all art is drawn in the browser.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Vite needs devDependencies (typescript, plugin-react) at build time.
  NPM_FLAGS = "--include=dev"

# scripts/prerender.ts writes a real page for every arc, place, character, crew and view
# (/arc/wano/index.html), plus sitemap.xml and robots.txt; Netlify serves those files first.
# Anything else, including links shared before paths existed (/?arc=wano&beat=onigashima),
# falls through to the app shell with a 200, and the app rewrites old links to their path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    # 'unsafe-inline' for styles only: the animation library sets style attributes.
    # No inline scripts, no third-party origins, no network calls of any kind.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
