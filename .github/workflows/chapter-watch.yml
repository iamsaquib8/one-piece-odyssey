name: Chapter watch

# New chapters usually release on Sundays; checking on Monday leaves a day for the wiki's
# summaries, which the release test needs.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Look for newly released chapters
        id: watch
        run: npm run -s chapter:check

      - name: Open or update the refresh issue
        if: steps.watch.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.watch.outputs.latest }}
          COVERED: ${{ steps.watch.outputs.covered }}
        run: |
          title="Chapter refresh: narrate through chapter ${LATEST}"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Chapters $((COVERED + 1))–${LATEST} are out; this edition narrates through ${COVERED}." \
            "Run the \`chapter-refresh\` skill in \`.claude/skills/chapter-refresh/\` (or follow its SKILL.md by hand), starting with \`npm run refresh:audit\`." \
            "Opened by the weekly chapter watch. It updates this issue rather than opening another while it stays open.")
          existing=$(gh issue list --state open --label content --search "Chapter refresh: in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label content
          fi
